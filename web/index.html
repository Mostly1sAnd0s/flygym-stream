<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>FlyGym Stream</title>
  <link rel="stylesheet" href="/style.css"/>
</head>
<body>
  <header>
    <h1>FlyGym Stream</h1>
    <div id="hud" class="hud">connecting&hellip;</div>
  </header>
  <main>
    <section id="video-pane" title="Drag to orbit, scroll to zoom">
      <img id="video" alt="live fly simulation"/>
      <div id="video-overlay"></div>
    </section>
    <aside id="controls">
      <div class="row">
        <button id="btn-neutral" title="Reset actuators to neutral pose">neutral</button>
        <button id="btn-pause" title="Freeze the simulation">pause</button>
        <button id="btn-resume" title="Unfreeze the simulation">resume</button>
        <button id="btn-step" title="Advance 30 substeps (while paused)">step</button>
        <button id="btn-reset" title="Reset model to the initial keyframe">reset</button>
      </div>
      <div class="row">
        <label for="speed">speed</label>
        <input id="speed" type="range" min="0.1" max="10" step="0.1" value="1"/>
        <span id="speed-val">1.0&times;</span>
      </div>
      <div class="row">
        <label for="step-n">step n</label>
        <input id="step-n" type="number" min="1" max="100000" value="30"/>
      </div>
      <div id="orbit-state" class="row">az 30&deg; &middot; el &minus;20&deg; &middot; 40 mm</div>
      <div id="sliders" class="sliders"></div>
      <p class="hint">
        Drag the video to orbit, scroll to zoom. One slider per actuated
        degree of freedom (count discovered from the server's status).
        Frames arrive as MJPEG over WebSocket.
      </p>
    </aside>
  </main>
  <script src="/app.js"></script>
</body>
</html>
